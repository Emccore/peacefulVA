<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<title>peacefulVA</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- 登录/注册：白底黑字 -->
<div id="auth-view">
  <div class="auth-card">
    <h1>peacefulVA</h1>
    <div class="tabs">
      <button id="tab-login" class="tab active" type="button">登录</button>
      <button id="tab-reg" class="tab" type="button">注册</button>
    </div>
    <form id="login-form">
      <label>账号<input id="li-user" autocomplete="username" required></label>
      <label>密码<input id="li-pass" type="password" autocomplete="current-password" required></label>
      <button class="btn-primary" type="submit">登录</button>
      <p class="err" id="li-err"></p>
    </form>
    <form id="reg-form" class="hidden">
      <label>账号<input id="rg-user" autocomplete="username" required></label>
      <label>昵称<input id="rg-name" maxlength="32" autocomplete="nickname"></label>
      <label>密码<input id="rg-pass" type="password" autocomplete="new-password" required></label>
      <label id="rg-code-row" class="hidden">注册码<input id="rg-code"></label>
      <button class="btn-primary" type="submit">注册并登录</button>
      <p class="err" id="rg-err"></p>
    </form>
    <p class="foot">登录后添加好友，即可文字聊天、打视频或语音电话</p>
  </div>
</div>

<!-- 内页：深色 -->
<div id="app-view" class="hidden">
  <aside id="side">
    <div class="side-head">
      <div class="me">
        <div id="my-name" class="my-name"></div>
        <div class="my-vid"><span id="my-vid"></span><button id="btn-copy-vid" class="mini" type="button">复制</button></div>
      </div>
      <button id="btn-logout" class="mini" type="button">退出</button>
    </div>
    <form id="add-form">
      <input id="add-vid" placeholder="输入好友 ID 添加" autocomplete="off" spellcheck="false">
      <button type="submit">添加</button>
    </form>
    <div id="contact-list"></div>
  </aside>

  <main id="main">
    <div id="empty-hint">选择左侧好友开始聊天<br><small>聊天记录只保存在当前页面，刷新后清空</small></div>

    <div id="chat-view" class="hidden">
      <header id="chat-head">
        <div class="peer">
          <b id="peer-name"></b>
          <span id="peer-status"></span>
        </div>
        <div class="call-btns">
          <button id="btn-call-video" type="button">视频通话</button>
          <button id="btn-call-voice" type="button">语音通话</button>
          <button id="btn-del-contact" class="mini" type="button">删除好友</button>
        </div>
      </header>
      <div id="msgs"></div>
      <form id="chat-form">
        <input id="chat-input" maxlength="2000" placeholder="输入消息" autocomplete="off">
        <button type="submit">发送</button>
      </form>
    </div>

    <div id="call-view" class="hidden">
      <video id="remote-video" autoplay playsinline></video>
      <video id="self-video" autoplay playsinline muted></video>
      <div id="voice-avatar" class="hidden"></div>
      <div id="quality-bar">
        <label>画质<select id="sel-vq"></select></label>
        <label>音质<select id="sel-aq"></select></label>
      </div>
      <div id="call-status"></div>
      <div id="ring-actions">
        <button id="btn-cancel-call" type="button">取消呼叫</button>
      </div>
      <div id="active-actions" class="hidden">
        <button id="btn-mic" title="麦克风">
          <svg viewBox="0 0 24 24"><path d="M12 3a3 3 0 0 1 3 3v6a3 3 0 0 1-6 0V6a3 3 0 0 1 3-3z"/><path d="M5 11a7 7 0 0 0 14 0"/><line x1="12" y1="18" x2="12" y2="21"/></svg>
        </button>
        <button id="btn-cam" title="摄像头">
          <svg viewBox="0 0 24 24"><rect x="3" y="6" width="12" height="12" rx="2"/><path d="M15 10l6-3.5v11L15 14"/></svg>
        </button>
        <button id="btn-share" title="屏幕共享">
          <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="12" rx="2"/><line x1="8" y1="20" x2="16" y2="20"/><line x1="12" y1="16" x2="12" y2="20"/></svg>
        </button>
        <button id="btn-hangup" class="danger" title="挂断">
          <svg viewBox="0 0 24 24"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg>
        </button>
      </div>
    </div>
  </main>
</div>

<!-- 来电提醒 -->
<div id="incoming" class="hidden">
  <div class="in-card">
    <p id="incoming-text"></p>
    <div class="in-btns">
      <button id="btn-accept" class="btn-primary" type="button">接听</button>
      <button id="btn-decline" type="button">拒绝</button>
    </div>
  </div>
</div>

<div id="overlay" class="hidden">
  <div class="panel">
    <p id="overlay-text">与服务器失去连接</p>
    <button id="btn-reconnect" class="btn-primary" type="button">重新连接</button>
  </div>
</div>

<div id="toast"></div>
<script src="app.js"></script>
</body>
</html>
